<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich 3D Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#F2D785" />
      <stop offset="55%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#A67C26" />
      <stop offset="100%" stop-color="#735212" />
    </linearGradient>

    <!-- Highlight Gold Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Deep Forest Green Medallion Background -->
    <radialGradient id="greenMedallion" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1B6638" />
      <stop offset="45%" stop-color="#14532D" />
      <stop offset="85%" stop-color="#0D351D" />
      <stop offset="100%" stop-color="#071E10" />
    </radialGradient>

    <!-- Emerald Pasture Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="20%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Milk White & Warm Ivory Drop -->
    <linearGradient id="milkIvory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Emboss and Drop Shadows -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Protective Drop Shadow Group -->
  <g filter="url(#logoShadow)">
    <!-- 1. Outer Gold Beveled Ring -->
    <circle cx="250" cy="250" r="236" fill="url(#goldGrad)" stroke="#8C661D" stroke-width="2" />
    <circle cx="250" cy="250" r="226" fill="#0A2215" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- 2. Milled Gold Coin Beads Perimeter -->
    <circle cx="250" cy="250" r="221" fill="none" stroke="url(#goldHighlight)" stroke-width="3" stroke-dasharray="2.5 8" opacity="0.85" />

    <!-- 3. Inner Gold Ring Rim -->
    <circle cx="250" cy="250" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- 4. Main Deep Forest Green Center Shield Disc -->
    <circle cx="250" cy="250" r="211" fill="url(#greenMedallion)" />

    <!-- Subtle Radial Decorative Pinstripe -->
    <circle cx="250" cy="250" r="198" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6 3" opacity="0.4" />

    <!-- 5. Triple Gold Quality Stars at Top Apex -->
    <g id="quality-stars" fill="url(#goldHighlight)">
      <!-- Left Star -->
      <polygon points="190,78 193,87 202,87 195,92 198,101 190,95 182,101 185,92 178,87 187,87" opacity="0.9" />
      <!-- Center Star (Largest) -->
      <polygon points="250,56 254,68 266,68 256,75 260,87 250,80 240,87 244,75 234,68 246,68" />
      <!-- Right Star -->
      <polygon points="310,78 313,87 322,87 315,92 318,101 310,95 302,101 305,92 298,87 307,87" opacity="0.9" />
    </g>

    <!-- 6. THE PROMINENT 'ASK' BRAND LETTERING (Core PRD Requirement) -->
    <!-- Vector glyphs with high-contrast bevel, serif details & gold gradient -->
    <g id="brand-ask-lettering" filter="url(#letterShadow)">
      <!-- Letter 'A' -->
      <path
        d="M 124,196 L 152,196 L 146,182 L 176,112 L 182,112 L 206,182 L 200,196 L 226,196 L 226,186 L 216,184 L 188,102 L 170,102 L 134,184 L 124,186 Z"
        fill="url(#goldGrad)"
        stroke="#593E0A"
        stroke-width="1.5"
      />
      <!-- 'A' Crossbar -->
      <path
        d="M 153,158 L 197,158 L 194,147 L 156,147 Z"
        fill="url(#goldHighlight)"
      />
      <!-- 'A' Inner Milk Drop Jewel -->
      <path
        d="M 175,124 C 175,124 182,136 182,142 C 182,146 179,149 175,149 C 171,149 168,146 168,142 C 168,136 175,124 175,124 Z"
        fill="url(#milkIvory)"
      />

      <!-- Letter 'S' -->
      <path
        d="M 276,128 C 274,116 264,103 248,103 C 232,103 220,113 220,126 C 220,140 232,146 248,152 C 267,158 281,166 281,181 C 281,194 269,203 250,203 C 231,203 218,193 216,177 L 233,174 C 235,183 242,190 250,190 C 258,190 264,185 264,178 C 264,169 253,163 238,157 C 221,150 205,142 205,126 C 205,111 218,91 247,91 C 268,91 285,103 289,124 Z"
        fill="url(#goldGrad)"
        stroke="#593E0A"
        stroke-width="1.5"
      />

      <!-- Letter 'K' -->
      <!-- Vertical Stem & Serifs -->
      <path
        d="M 292,196 L 322,196 L 322,186 L 313,184 L 313,114 L 322,112 L 322,102 L 292,102 L 292,112 L 301,114 L 301,184 L 292,186 Z"
        fill="url(#goldGrad)"
        stroke="#593E0A"
        stroke-width="1.5"
      />
      <!-- Upper Diagonal Arm -->
      <path
        d="M 312,149 L 348,114 L 339,112 L 339,102 L 368,102 L 368,112 L 358,114 L 327,143 L 348,184 L 359,186 L 359,196 L 333,196 L 318,162 L 312,168 Z"
        fill="url(#goldGrad)"
        stroke="#593E0A"
        stroke-width="1.5"
      />

      <!-- High-visibility Typographic Overlay to ensure 100% universal readability across all renderers -->
      <text
        x="250"
        y="180"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Cinzel', 'Georgia', 'Arial Black', serif"
        font-weight="900"
        font-size="82"
        letter-spacing="6"
        fill="url(#goldGrad)"
        stroke="#593E0A"
        stroke-width="1.2"
        opacity="0.98"
      >ASK</text>
    </g>

    <!-- 7. Pasture Mound Under Cow -->
    <path
      d="M 140,314 Q 250,296 360,314 Q 250,326 140,314 Z"
      fill="#0F4224"
      stroke="url(#goldGrad)"
      stroke-width="1"
      opacity="0.8"
    />

    <!-- 8. Majestic Dairy Cow / Buffalo Silhouette (Pristine Milk Ivory) -->
    <g id="dairy-cow" transform="translate(162, 206) scale(0.44)" filter="url(#letterShadow)">
      <!-- Pure Dairy Cow Body -->
      <path
        d="M 50,140 C 50,132 55,124 64,120 C 72,116 88,110 102,108 C 114,106 128,96 140,88 C 150,80 162,72 176,70 C 188,68 196,72 206,78 C 216,74 228,74 238,80 C 248,86 254,98 256,112 C 262,118 276,134 286,150 C 292,160 292,176 286,186 C 280,196 268,196 260,192 L 254,214 C 250,226 242,230 234,228 L 226,186 C 212,190 196,192 180,192 C 162,198 146,204 126,204 L 118,256 C 114,264 106,268 98,264 L 94,208 C 86,208 78,202 72,192 L 58,256 C 54,264 46,268 38,264 L 40,186 C 32,182 26,170 26,158 C 26,144 34,132 48,126 Z"
        fill="url(#milkIvory)"
        stroke="#0D351D"
        stroke-width="2.5"
      />
      <!-- Cow Holstein Spot Patches for Authentic Dairy Identity -->
      <path
        d="M 120,118 C 134,118 144,128 142,142 C 140,154 128,162 116,158 C 104,154 98,140 102,130 C 106,122 112,118 120,118 Z"
        fill="#14532D"
      />
      <path
        d="M 180,110 C 196,110 206,122 204,138 C 202,150 190,160 178,156 C 166,152 162,138 166,124 C 170,114 174,110 180,110 Z"
        fill="#14532D"
      />
      <path
        d="M 230,126 C 242,126 250,136 248,148 C 246,158 238,166 228,162 C 218,158 214,146 218,136 C 220,130 224,126 230,126 Z"
        fill="#14532D"
      />
      <!-- Udder details -->
      <circle cx="160" cy="202" r="8" fill="#FDE68A" />
      <circle cx="174" cy="202" r="7" fill="#FDE68A" />
    </g>

    <!-- 9. Curved Emerald Pasture Ribbon for 'DAIRY MANAGEMENT' -->
    <g id="ribbon-banner">
      <!-- Ribbon Back Folds -->
      <path d="M 88,382 L 126,356 L 126,400 Z" fill="#034B36" />
      <path d="M 412,382 L 374,356 L 374,400 Z" fill="#034B36" />
      <path d="M 76,412 L 126,400 L 102,374 L 76,412 Z" fill="#023023" />
      <path d="M 424,412 L 374,400 L 398,374 L 424,412 Z" fill="#023023" />

      <!-- Main Curved Ribbon Body -->
      <path
        d="M 112,372 C 180,344 320,344 388,372 C 378,414 316,424 250,424 C 184,424 122,414 112,372 Z"
        fill="url(#ribbonGrad)"
        stroke="url(#goldGrad)"
        stroke-width="2.5"
      />

      <!-- Inner Ribbon Gold Pinstripe Border -->
      <path
        d="M 124,374 C 185,352 315,352 376,374"
        fill="none"
        stroke="url(#goldHighlight)"
        stroke-width="1.2"
        opacity="0.8"
      />

      <!-- Inscribed Text on Ribbon -->
      <text
        x="250"
        y="398"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="19"
        letter-spacing="3.5"
        fill="#FFFFFF"
        filter="url(#letterShadow)"
      >DAIRY MANAGEMENT</text>
    </g>

    <!-- 10. Established Crest Subtitle / Year -->
    <g id="est-text" opacity="0.9">
      <circle cx="216" cy="442" r="2.5" fill="url(#goldHighlight)" />
      <text
        x="250"
        y="446"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="700"
        font-size="11"
        letter-spacing="2.5"
        fill="url(#goldHighlight)"
      >EST. 2024</text>
      <circle cx="284" cy="442" r="2.5" fill="url(#goldHighlight)" />
    </g>
  </g>
</svg>
